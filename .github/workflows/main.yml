name: Build Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          sed -i '/MaxPermSize/d' gradle.properties app/gradle.properties 2>/dev/null || true
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Build attempt $i hit a snag, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubicTimer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
