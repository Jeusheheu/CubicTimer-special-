name: Build Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          JAVA_TOOL_OPTIONS: >-
            --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
            --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
            --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
            --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED
        run: |
          sed -i '/MaxPermSize/d' gradle.properties app/gradle.properties 2>/dev/null || true
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEYSTORE_PASS" \
            -alias cubictimer_special \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Cubic Timer Special Edition, OU=Special Edition, O=Cubic Timer Special Edition, L=Manila, S=Metro Manila, C=PH"
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="cubictimer_special" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASS"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CubicTimer-special-release-apk
          path: app/build/outputs/apk/release/*.apk
